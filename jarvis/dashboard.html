<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS • แดชบอร์ด</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6f9;--surface:#fff;--text:#17202c;--muted:#64748b;--line:#dce2ea;--accent:#255fd4;--good:#20a46b;--bad:#d94a53;--warn:#d38316}
    @media(prefers-color-scheme:dark){:root{--bg:#10151e;--surface:#1b2431;--text:#f2f5fa;--muted:#abb8c9;--line:#354252;--accent:#8bb6ff;--good:#46cf97;--bad:#ff777d;--warn:#ffc064}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 70px}h1{margin:0;font-size:2rem}h2{font-size:1.3rem;margin:32px 0 12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.sub,.muted{color:var(--muted)}.banner{padding:10px 14px;border-radius:10px;background:var(--bad);color:white;margin:16px 0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.card h3{margin:0 0 8px}.device-head{display:flex;justify-content:space-between;gap:10px}.bulb{font-size:2.2rem;line-height:1}.on .bulb{filter:drop-shadow(0 0 8px #f6bd32)}.state{font-weight:700;font-size:1.2rem}.on .state{color:var(--good)}.off .state{color:var(--muted)}button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--surface);cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}.buttons{display:flex;gap:6px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:6px}.dot.running{background:var(--good)}.dot.starting{background:var(--warn)}.dot.crashed,.dot.missing{background:var(--bad)}.dot.external{background:var(--accent)}.small{font-size:.85rem;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:8px;padding:12px;max-height:330px;overflow:auto;font-size:.8rem}progress{width:100%;height:14px;accent-color:var(--good)}.warning{color:var(--warn)}.entry{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.entry:last-child{border:0}.flash{animation:flash .7s ease}@keyframes flash{50%{outline:3px solid var(--accent)}}@media(max-width:420px){main{padding:18px 12px 50px}h1{font-size:1.6rem}.card,.panel{padding:14px}}
    .voice-panel{margin-top:18px}.voice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.voice-head h2{margin:0}.voice-status{font-weight:700}.voice-live{margin:12px 0 0;min-height:105px;max-height:185px}.voice-hint{margin:4px 0 0;color:var(--muted);font-size:.9rem}
  </style>
</head>
<body><main>
  <div class="top"><div><h1>JARVIS</h1><div class="sub">แดชบอร์ดอุปกรณ์และคำสั่งเสียง</div></div><div id="updated" class="small">กำลังเชื่อมต่อ...</div></div>
  <div id="error" class="banner hidden" role="alert"></div>
  <section class="panel voice-panel" aria-label="สถานะเสียงและ log สด">
    <div class="voice-head"><h2>ไมโครโฟนและ log สด</h2><div id="voice-status" class="voice-status"><span class="dot"></span>กำลังตรวจสอบ...</div></div>
    <p class="voice-hint">พูด “จาวิส ปิดไฟที” ใส่ไมค์ แล้วดูข้อความที่ระบบได้ยินด้านล่าง</p>
    <div id="voice-last" class="small">ยังไม่มีคำพูดที่จับได้</div>
    <pre id="voice-live-log" class="voice-live" aria-live="polite">กำลังโหลด log...</pre>
  </section>
  <h2>อุปกรณ์</h2><div id="devices" class="grid"></div>
  <h2>บริการ</h2><div id="services" class="panel"></div><div id="logs" class="hidden"></div>
  <h2>คำสั่งเสียงล่าสุด</h2><div id="recent" class="panel"></div>
</main><script>
const $=id=>document.getElementById(id);let previous={},busy=new Set(),openLog=null,logTimer=null;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function showError(message){$('error').textContent=message;$('error').classList.toggle('hidden',!message)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error||'ทำรายการไม่สำเร็จ');return value}
function addText(parent,tag,cls,text){const x=el(tag,cls,text);parent.append(x);return x}
function renderDevices(devices){const box=$('devices');const seen=new Set();for(const d of devices){seen.add(d.device_id);let card=Array.from(box.children).find(x=>x.dataset.id===d.device_id);if(!card){card=el('div','card');card.dataset.id=d.device_id;box.append(card)}const signature=JSON.stringify(d.state);if(card.dataset.signature===signature)continue;card.dataset.signature=signature;if(previous[d.device_id]&&previous[d.device_id]!==signature){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash')}previous[d.device_id]=signature;card.replaceChildren();const head=el('div','device-head');addText(head,'h3','',d.name||d.device_id);addText(head,'span','small',d.device_id);card.append(head);if(d.device_type==='light'){const on=d.state?.power==='on';card.classList.toggle('on',on);card.classList.toggle('off',!on);addText(card,'div','bulb','💡');addText(card,'div','state',on?'เปิด':'ปิด');const btn=addText(card,'button','primary',on?'ปิดไฟ':'เปิดไฟ');btn.disabled=busy.has(d.device_id);btn.onclick=async()=>{busy.add(d.device_id);btn.disabled=true;try{await post('/api/device',{device_id:d.device_id,action:on?'turn_off':'turn_on'})}catch(e){showError(e.message)}finally{busy.delete(d.device_id);await refresh()}}}else if(d.device_type==='garden'){const moisture=Number(d.state?.soil_moisture||0);addText(card,'div','',`ความชื้นดิน ${moisture}%`);const bar=el('progress');bar.max=100;bar.value=moisture;card.append(bar);if(moisture<30)addText(card,'div','warning','ควรรดน้ำ');addText(card,'div','',`อุณหภูมิ ${d.state?.temperature??'-'}°C`);addText(card,'div','',`ความชื้นอากาศ ${d.state?.humidity??'-'}%`)}else{for(const [key,value] of Object.entries(d.state||{}))addText(card,'div','',`${key}: ${value}`)}}for(const c of Array.from(box.children))if(!seen.has(c.dataset.id))c.remove();if(!devices.length)box.replaceChildren(el('div','card muted','ยังไม่มีอุปกรณ์ที่เชื่อมต่อ'))}
function renderServices(services){const box=$('services');const seen=new Set();for(const s of services){seen.add(s.name);let old=Array.from(box.children).find(x=>x.dataset.name===s.name);const key=JSON.stringify([s.status,s.reason,s.exit_code]);const detail=`${s.reason||''}${s.uptime_s!=null?` · ${s.uptime_s} วินาที`:''}${s.exit_code!=null?` · exit ${s.exit_code}`:''}`;if(old&&old.dataset.key===key){old.querySelector('.small').textContent=detail;continue}if(old)old.remove();const row=el('div','row');row.dataset.name=s.name;row.dataset.key=key;const info=el('div');const title=el('div');title.append(el('span',`dot ${s.status}`),document.createTextNode(`${s.label} · ${s.status}`));info.append(title);addText(info,'div','small',`${s.reason||''}${s.uptime_s!=null?` · ${s.uptime_s} วินาที`:''}${s.exit_code!=null?` · exit ${s.exit_code}`:''}`);row.append(info);const buttons=el('div','buttons');if(s.status!=='external'){for(const op of ['start','stop','restart']){if((op==='start'&&['running','starting'].includes(s.status))||(op==='stop'&&['stopped','missing','crashed'].includes(s.status)))continue;const b=addText(buttons,'button','',({start:'เริ่ม',stop:'หยุด',restart:'เริ่มใหม่'})[op]);b.onclick=async()=>{b.disabled=true;try{await post('/api/service',{name:s.name,op});await refresh()}catch(e){showError(e.message)}finally{b.disabled=false}}}}const log=addText(buttons,'button','','ดู log');log.onclick=()=>toggleLog(s.name);row.append(buttons);box.append(row)}for(const row of Array.from(box.children))if(!seen.has(row.dataset.name))row.remove()}
function renderRecent(entries){const box=$('recent');box.replaceChildren();if(!entries.length){box.append(el('div','muted','ยังไม่มีคำสั่งเสียง'));return}for(const item of entries){const entry=el('div','entry');addText(entry,'div','small',item.time||'');addText(entry,'div','',item.command||'ไม่ได้ยินคำสั่ง');addText(entry,'div',`small ${['unclear','error'].includes(item.intent)?'warning':''}`,`${item.intent||'-'} · ${item.reply||'-'}`);box.append(entry)}}
function renderVoiceStatus(services){const voice=services.find(s=>s.name==='voice');const box=$('voice-status');const status=voice?.status||'stopped';const label=({running:'กำลังฟัง',starting:'กำลังเปิดไมค์',external:'voice เปิดอยู่ภายนอก',stopped:'ไมค์หยุดอยู่',crashed:'voice หยุดผิดปกติ',missing:'voice ยังไม่พร้อม'})[status]||status;box.replaceChildren(el('span',`dot ${status}`),document.createTextNode(label));if(voice?.reason)box.title=voice.reason;else box.removeAttribute('title')}
async function loadVoiceLog(){const box=$('voice-live-log');try{const r=await fetch('/api/logs?name=voice',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const heard=data.lines.slice().reverse().find(line=>line.includes('ได้ยิน:')||line.includes('คำสั่ง:'));$('voice-last').textContent=heard?`ล่าสุด: ${heard}`:'ยังไม่มีคำพูดที่จับได้';const content=data.lines.slice(-12).join('\n')||'ยังไม่มี log จาก voice';if(box.textContent!==content){box.textContent=content;box.scrollTop=box.scrollHeight}}catch(e){box.textContent='ติดต่อ voice log ไม่ได้'}}
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('ติดต่อ dashboard ไม่ได้');const state=await r.json();showError(state.devices_error||'');renderVoiceStatus(state.services);renderDevices(state.devices);renderServices(state.services);renderRecent(state.recent);$('updated').textContent=`อัปเดต ${new Date().toLocaleTimeString('th-TH')}`}catch(e){showError('ติดต่อ dashboard ไม่ได้');$('voice-status').textContent='ติดต่อ dashboard ไม่ได้'}}
async function loadLog(){if(!openLog)return;try{const r=await fetch(`/api/logs?name=${encodeURIComponent(openLog)}`);const data=await r.json();$('logs').querySelector('pre').textContent=data.lines.join('\n')||'ยังไม่มี log'}catch(e){$('logs').querySelector('pre').textContent='อ่าน log ไม่ได้'}}
function toggleLog(name){const box=$('logs');if(openLog===name){openLog=null;box.classList.add('hidden');clearInterval(logTimer);return}openLog=name;box.className='panel';box.replaceChildren(el('h3','',`Log: ${name}`),el('pre'));clearInterval(logTimer);loadLog();logTimer=setInterval(loadLog,2000)}
refresh();loadVoiceLog();setInterval(refresh,1000);setInterval(loadVoiceLog,1000);
</script></body></html>
