# JARVIS voice settings. Paths are relative to this file. Upgrading hardware usually
# means changing only the model files here.

[stt]
# Fast model that listens for the wake word all the time.
wake_model = ".models/ggml-base.bin"
# More accurate model for the command after the wake word (falls back to wake_model if missing).
# Thonburian Whisper medium (Thai fine-tune by BiodatLab), converted from
# biodatlab/whisper-th-medium-combined; ~0.95s per command on an M4. See README.
command_model = ".models/ggml-thonburian-medium-q5_0.bin"

[llm]
# OpenAI-compatible chat endpoint (llama-server running Qwen).
endpoint = "http://127.0.0.1:8080"
model = ".models/qwen2-7b-instruct-q4_k_m.gguf"

[run]
fake_devices = ["light", "garden"] # Remove when using real ESP32 devices.
autostart_voice = true

[dashboard]
host = "127.0.0.1"
port = 8766

[tts]
# "f5" = natural voice cloned by F5-TTS Thai (the `tts` service, needs .venv-tts; see README),
# falling back to "say" when it is unavailable. "say" = the macOS voice below only.
engine = "f5"
voice = "Kanya"

[tts.f5]
port = 8767
# 2-8 s of clean speech. Its exact transcript goes in a .txt file with the same name.
# Keep both in .models/ (git-ignored): a voice clip is someone's voice, never commit it.
ref_audio = ".models/f5/reference.wav"
# Quality vs speed: 16 ≈ 1x real time on an M4, 8 is faster but rougher, 32 is the model default.
step = 16

[voice]
# Speaking while JARVIS talks cuts it off. Works well with a headset; with speakers
# JARVIS may hear itself, so set false if it keeps interrupting itself.
barge_in = true
# After a reply, keep listening this long for a follow-up without saying "จาวิส" again.
follow_up_seconds = 5

[persona]
# "male" → replies end with ครับ, "female" → ค่ะ. Match the TTS voice.
gender = "male"

[weather]
# Bangkok. The weather skill sends only these coordinates to api.open-meteo.com.
lat = 13.7563
lon = 100.5018

[dataset]
# Keeps each voice command's audio and transcripts locally, for measuring and
# training models later. Nothing leaves this machine.
enabled = true
dir = "work/dataset"
